version: "3.9"

services:
  postgres:
    image: postgres:15
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "5433:5432"
    volumes:
      - ./database/init.sql:/docker-entrypoint-initdb.d/init.sql
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  etl_service:
    build: ./services/etl
    depends_on:
      postgres:
        condition: service_healthy
    env_file: .env
    volumes:
      - ./data:/app/data

  ml_service:
    build: ./services/ml
    ports:
      - "8001:8001"
    depends_on:
      etl_service:
        condition: service_completed_successfully
    env_file: .env
    volumes:
      - ./services/ml/models:/app/models
      - ./data:/app/data

  api_service:
    build: ./services/api
    ports:
      - "8000:8000"
    depends_on:
      ml_service:
        condition: service_healthy
      postgres:
        condition: service_healthy
    env_file: .env

volumes:
  pgdata:
